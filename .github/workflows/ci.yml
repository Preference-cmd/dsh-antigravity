name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, build, checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Committed build output is current
        run: node scripts/verify-build-output.mjs
      - name: Status route cache contract
        run: node scripts/verify-route-cache.mjs
      - name: Print-mode provider contract
        run: node scripts/verify-print-runner.mjs
      - name: Model selection contract
        run: node scripts/verify-model-settings.mjs
