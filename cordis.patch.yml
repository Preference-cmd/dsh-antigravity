# One delegation path: this plugin registers the `antigravity` subagent provider
# (one `agy` print-mode child per run), and `subagent_antigravity` is the
# model-facing tool that starts one. `dsh-tool-subagent` is a dependency of this
# plugin, so the profile's hoisted node_modules resolves it next to the harness
# that loads this layer.
#
# `model`, `effort`, and `mode` are optional deployment defaults: omit them to
# inherit the account's own model and reasoning settings. `AGY_BIN` overrides the
# binary path for the current profile; the default is the installer's location
# for a per-user `agy` install.

- insert:
    - id: subagent-antigravity
      name: 'dsh-antigravity'

    - id: tool-subagent-antigravity
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: antigravity
        toolName: subagent_antigravity
        maxDepth: provider-managed
